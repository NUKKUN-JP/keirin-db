name: 大聖堂キャッシュ 過去分 (期間指定)

# 新ロジック(大聖堂)の事前計算を過去レースに対して実行する。
# 月別DB keirin_months/keirin_YYYYMM.jsonl から各レースの全買い目候補を
# 計算し、結果・払戻を添えて cathedral_cache/cathedral_YYYYMMDD.json に出力。
# アプリは大聖堂タブでこのキャッシュを読み、その場計算なしで表示する。
#
# 使い方 (手動実行):
#   month       対象月 YYYYMM (例: 202606)。指定すればその月を処理。
#   start_date  開始日 YYYYMMDD (任意。月内をさらに絞る)
#   end_date    終了日 YYYYMMDD (任意)
#   ※ まず6月だけ回すなら month=202606 のみ指定。

on:
  workflow_dispatch:
    inputs:
      month:
        description: '対象月 YYYYMM (例 202606)'
        required: false
        default: ''
      start_date:
        description: '開始日 YYYYMMDD (任意)'
        required: false
        default: ''
      end_date:
        description: '終了日 YYYYMMDD (任意)'
        required: false
        default: ''
      cap_n:
        description: '1レースの候補上限 (既定40)'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: keirin-cathedral-backfill
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 月別ファイルから一体型DBを再構築 (月別が無い場合の保険)
        run: |
          if [ ! -d keirin_months ]; then
            echo "keirin_months が無いため split_monthly で再構築を試行"
            python split_monthly_v1.py split || true
          fi

      - name: 大聖堂キャッシュ生成
        env:
          CATHEDRAL_MONTH: ${{ github.event.inputs.month }}
          CATHEDRAL_START: ${{ github.event.inputs.start_date }}
          CATHEDRAL_END: ${{ github.event.inputs.end_date }}
          CATHEDRAL_CAP_N: ${{ github.event.inputs.cap_n }}
          CATHEDRAL_RAWSCORE: 'db'
        run: python build_cathedral_cache_v1.py

      - name: コミット＆プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d cathedral_cache ]; then
            git add -A cathedral_cache/
          fi
          if git diff --cached --quiet; then
            echo "変更なし、コミットスキップ"
          else
            git commit -m "大聖堂キャッシュ(過去): $(date +%Y%m%d_%H%M)"
            git pull --rebase --autostash || true
            git push || { echo "::warning::push失敗。再実行で回収"; exit 0; }
          fi
