name: 統計辞書 自動生成

on:
  schedule:
    # JST 6:00 (UTC 21:00) に1日1回。daily_update の結果確定(JST 0:05)後・DBが最新の状態で統計を生成。
    # 統計は過去DBの集計のみ(通信なし・リアルタイム情報に非依存)なので1日1回で十分。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      with_monthly:
        description: '系統1の月別辞書(dicts_monthly)も生成する場合は 1 (月初向け)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: keirin-stats
  cancel-in-progress: false

jobs:
  build-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 月別ファイルから一体型DBを再構築
        run: python split_monthly_v1.py rebuild

      - name: takesen 構造を用意してDB配置
        run: |
          mkdir -p takusen/data/dicts takusen/data/static takusen/code/FINAL
          # 一体型DBを takusen/data へ
          if [ -f keirin_data_scored_v2.jsonl ]; then
            cp keirin_data_scored_v2.jsonl takusen/data/keirin_data_scored_v2.jsonl
          else
            echo "::error::keirin_data_scored_v2.jsonl が無い (rebuild失敗?)"
            exit 1
          fi
          # 補助ファイルを takusen/data/static/ に配置 (直下 or static/ から拾う)
          if [ -d static ]; then
            cp -r static/. takusen/data/static/ 2>/dev/null || true
          fi
          for sf in venue_home_direction.json bank_data.json venue_profile.json; do
            if [ -f "$sf" ]; then
              cp "$sf" "takusen/data/static/$sf" 2>/dev/null || true
            fi
            if [ -f "takusen/data/static/$sf" ]; then
              echo "[static] OK: $sf"
            else
              echo "::warning::補助ファイルが無い: $sf (系統1が不完全になる可能性)"
            fi
          done
          # 既存の dicts/ があれば takusen/data/dicts/ に引き継ぐ
          if [ -d dicts ]; then
            cp -r dicts/. takusen/data/dicts/ 2>/dev/null || true
          fi

      - name: 統計生成 (build_all_stats_v1)
        env:
          # 月別辞書も作るか (workflow_dispatch入力)
          KEIRIN_WITH_MONTHLY: ${{ github.event.inputs.with_monthly }}
        run: |
          if [ "$KEIRIN_WITH_MONTHLY" = "1" ]; then
            python build_all_stats_v1.py --monthly-default
          else
            python build_all_stats_v1.py
          fi

      - name: 生成統計を dicts/ にコピー (98MB rsrank_7carは除外)
        run: |
          mkdir -p dicts
          # 小さい統計だけリポジトリ dicts/ に反映。98MBの7carは除外(月1・Releases別管理)。
          for f in \
            kimari_player_role_FINAL.jsonl \
            kimari_player_cond.jsonl \
            kimari_stats_FINAL.json \
            ana_score_global_FINAL.jsonl \
            ana_score_venue_FINAL.jsonl \
            ana_score_summary.txt \
            player_line_lead_rate_FINAL.json \
            player_profile_index_FINAL.json \
            rawscore_pattern_stats_FINAL.json \
            player_rsrank_finish_9car_FINAL.jsonl ; do
            if [ -f "takusen/data/dicts/$f" ]; then
              cp "takusen/data/dicts/$f" "dicts/$f"
            fi
          done
          # player_profiles_FINAL/ フォルダ(プロファイル群)も反映 (サイズ確認のうえ)
          if [ -d takusen/data/dicts/player_profiles_FINAL ]; then
            rm -rf dicts/player_profiles_FINAL
            cp -r takusen/data/dicts/player_profiles_FINAL dicts/player_profiles_FINAL
          fi
          echo "=== dicts/ サイズ確認 (各ファイル25MB制限・rsrank_7carは除外済) ==="
          ls -la dicts/ || true
          # 念のため: 25MB(26214400B)超のファイルがあれば警告 (GitHub raw制限)
          find dicts/ -type f -size +25M -exec echo "::warning::25MB超のファイル: {}" \;

      - name: dicts/ をコミット＆プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d dicts ]; then
            git add dicts/
          fi
          if git diff --cached --quiet; then
            echo "統計に変更なし、コミットスキップ"
          else
            git commit -m "統計辞書更新: $(date +%Y%m%d_%H%M)"
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::warning::衝突したため今回の統計は破棄。次回実行が再生成します"
              exit 0
            fi
            git push || { echo "::warning::push失敗。次回実行が再生成します"; exit 0; }
          fi
