name: 2車単オッズ収集 当日分

# today_cache/races_YYYYMMDD.json (当日出走表) を入力に、gambooから2車単オッズを
# 取得して odds_cache/YYYYMMDD.jsonl に保存する。
# 確定ロジック検証(人気薄判定・回収率)用のオッズをGitHub上で日々蓄積する。
#
# 実行タイミング: cathedral_today より後(当日出走表が揃った後)。
#   締切直前ほどオッズが確定するため、レース時間帯にも複数回実行する。
#   ※過去日のオッズは gamboo 側で数日で失効するため、当日〜翌日に取るのが要。

on:
  schedule:
    - cron: '30 22 * * *'   # JST 07:30
    - cron: '0 2 * * *'     # JST 11:00
    - cron: '0 5 * * *'     # JST 14:00
    - cron: '0 8 * * *'     # JST 17:00
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD (空欄=当日)'
        required: false
        default: ''
      start_date:
        description: '範囲開始 YYYYMMDD (範囲収集する場合)'
        required: false
        default: ''
      end_date:
        description: '範囲終了 YYYYMMDD (範囲収集する場合)'
        required: false
        default: ''
      force:
        description: '既存キャッシュも再取得 (1でON)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: keirin-fetch-odds
  cancel-in-progress: false

jobs:
  fetch_odds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: オッズ収集
        env:
          ODDS_DATE: ${{ github.event.inputs.date }}
          ODDS_START_DATE: ${{ github.event.inputs.start_date }}
          ODDS_END_DATE: ${{ github.event.inputs.end_date }}
          ODDS_FORCE: ${{ github.event.inputs.force }}
          ODDS_ROSTER_DIR: today_cache
          ODDS_OUT_DIR: odds_cache
        run: |
          python fetch_odds_cache_v3.py

      - name: コミット＆プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d odds_cache ]; then
            git add -A odds_cache/
          fi
          if git diff --cached --quiet; then
            echo "変更なし、コミットスキップ"
          else
            git commit -m "2車単オッズ収集: $(date +%Y%m%d_%H%M)"
            git pull --rebase --autostash || true
            git push || { echo "::warning::push失敗。次回実行が回収"; exit 0; }
          fi
