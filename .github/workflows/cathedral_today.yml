name: 大聖堂キャッシュ 当日分

# today_cache/races_YYYYMMDD.json (当日出走表) を入力に、新ロジック(大聖堂)の
# 当日買い目候補を事前計算し cathedral_cache/cathedral_YYYYMMDD.json に出力する。
# これによりアプリは大聖堂タブで当日レースをその場計算せず表示できる
# (起動後の託宣ボタンのダウン対策)。
#
# 実行タイミング: today_basic (当日基本データ取得) の後。
#   JST 6:40 / 7:10 (UTC 21:40 / 22:10)。当日出走表が揃った後に走る。
#   ライン補完版にも追従するため 14:20 / 15:20 にも実行。

on:
  schedule:
    - cron: '40 21 * * *'
    - cron: '10 22 * * *'
    - cron: '20 5 * * *'
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD (空欄=当日)'
        required: false
        default: ''
      cap_n:
        description: '1レースの候補上限 (既定40)'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: keirin-cathedral-today
  cancel-in-progress: false

jobs:
  build_today:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 当日キャッシュ生成
        env:
          CATHEDRAL_CAP_N: ${{ github.event.inputs.cap_n }}
          CATHEDRAL_RAWSCORE: 'db'
        run: |
          DATE_IN="${{ github.event.inputs.date }}"
          if [ -z "$DATE_IN" ]; then
            DATE_IN=$(date +%Y%m%d)
          fi
          TODAY_JSON="today_cache/races_${DATE_IN}.json"
          echo "対象: $TODAY_JSON"
          if [ ! -f "$TODAY_JSON" ]; then
            echo "::warning::$TODAY_JSON が無い。today_basic 未完了の可能性。スキップ"
            exit 0
          fi
          CATHEDRAL_TODAY_JSON="$TODAY_JSON" python build_cathedral_cache_v1.py

      - name: コミット＆プッシュ
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d cathedral_cache ]; then
            git add -A cathedral_cache/
          fi
          if git diff --cached --quiet; then
            echo "変更なし、コミットスキップ"
          else
            git commit -m "大聖堂キャッシュ(当日): $(date +%Y%m%d_%H%M)"
            git pull --rebase --autostash || true
            git push || { echo "::warning::push失敗。次回実行が回収"; exit 0; }
          fi
